plugins { id 'com.android.application' }
android {
  namespace 'app.hanpok.proto'
  compileSdk 35
  defaultConfig { applicationId 'app.hanpok.proto'; minSdk 26; targetSdk 35; versionCode 1; versionName '0.1' }
  buildTypes { release { minifyEnabled false; signingConfig signingConfigs.debug } }
  compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
  aaptOptions { noCompress 'html' }
}
