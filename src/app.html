<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>한 폭 프로토타입</title>
<style>
/*FONTS*/
:root{
  --g900:#191F28;--g800:#333D4B;--g700:#4E5968;--g600:#6B7684;--g500:#8B95A1;--g400:#B0B8C1;--g300:#D1D6DB;--g200:#E5E8EB;--g100:#F2F4F6;--g50:#F9FAFB;
  --primary:#191F28;--primary-press:#000000;--primary-50:#F2F4F6;--primary-100:#E5E8EB;--green:#191F28;
  --sans:'Pretendard',-apple-system,BlinkMacSystemFont,system-ui,sans-serif;
  --serif:'HPSerif','Noto Serif KR',serif;
  --sat:0px;--sab:0px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:#101215;font-family:var(--sans);font-synthesis:none;color:var(--g900);-webkit-font-smoothing:antialiased;word-break:keep-all;overflow-wrap:break-word;overflow:hidden}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
img{display:block}
.serif{font-family:var(--serif)}

/* ---------- stage / phone ---------- */
#stage{height:100%;display:flex;align-items:center;justify-content:center;padding:24px}
#phoneWrap{position:relative;transform-origin:center center}
#phone{width:390px;height:844px;border-radius:48px;overflow:hidden;position:relative;background:#fff;
  box-shadow:0 0 0 10px #1b1e23,0 0 0 11px #31353c,0 40px 90px rgba(0,0,0,.55);isolation:isolate}
#power{position:absolute;right:-16px;top:210px;width:6px;height:78px;border-radius:0 4px 4px 0;background:#31353c;border:0}
#power::after{content:'화면 켜기';position:absolute;left:16px;top:50%;transform:translateY(-50%);white-space:nowrap;font-size:12px;color:#8B95A1}
#power:hover{background:#4a4f57}
body.desk{--sat:30px;--sab:10px}
body.full #stage{padding:0}
body.full #phone{width:100vw;height:100vh;height:100dvh;border-radius:0;box-shadow:none}
body.full #power{display:none}

/* fake status bar (desktop frame only) */
#sb{position:absolute;top:0;left:0;right:0;height:30px;z-index:95;display:none;justify-content:space-between;align-items:center;padding:4px 30px 0 34px;font-size:14px;font-weight:600;pointer-events:none;color:var(--g900);transition:color .2s}
body.desk #sb{display:flex}
#sb.light{color:#fff}
#sb .ic{display:flex;gap:5px;align-items:center}

/* ---------- screens ---------- */
#screens{position:absolute;inset:0}
.screen{position:absolute;inset:0;display:flex;flex-direction:column;background:#fff;overflow:hidden;isolation:isolate;z-index:0}
.screen.enter{animation:slideIn .18s cubic-bezier(.2,.8,.2,1)}
.screen.leave{animation:slideOut .25s ease forwards;z-index:5}
.screen.fade{animation:fadeIn .35s ease}
/* 꾸미기 탭 들고 날 때: 화면은 살짝 겹쳐 흐려지고, 탭 바는 따로 접히고 펼쳐짐 */
.screen.xfade{background:transparent;animation:none}
.screen.xfade>:not(.tabbar){animation:fadeIn .26s cubic-bezier(.42,0,1,1) both}
@keyframes slideIn{from{transform:translateX(100%)}to{transform:none}}
@keyframes slideOut{to{transform:translateX(100%)}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.body{flex:1;overflow-y:auto;overflow-x:hidden;scrollbar-width:none;overscroll-behavior:contain}
.body::-webkit-scrollbar{display:none}
.pb{height:32px}

/* Navigation */
.nav{flex-shrink:0;height:calc(56px + var(--sat));padding:var(--sat) 24px 0;display:flex;align-items:center;justify-content:space-between;position:relative;background:#fff}
.nav .l,.nav .r{display:flex;align-items:center;gap:16px;min-width:24px;z-index:1}
.nav .title{position:absolute;left:72px;right:72px;bottom:0;height:56px;display:flex;align-items:center;justify-content:center;font-size:17px;font-weight:600;color:var(--g900);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ib{width:24px;height:24px;display:flex;align-items:center;justify-content:center;border:0;background:none;color:var(--g900);position:relative}
.ib::before{content:'';position:absolute;inset:-10px}
.nav .txt{border:0;background:none;font-size:16px;font-weight:500;color:var(--g600)}
.logo{display:flex;align-items:center;gap:8px;font-family:var(--serif);font-weight:700;font-size:20px;color:var(--g900)}
.logo .mk{width:28px;height:28px;border-radius:8px;background:var(--primary);color:#fff;display:flex;align-items:center;justify-content:center}

/* HeaderV1 */
.hd{padding:8px 24px 24px}
.hd h1{font-size:26px;line-height:35px;font-weight:700;letter-spacing:-.4px;color:var(--g900);text-wrap:balance}
.hd p{margin-top:8px;font-size:15px;line-height:23px;color:var(--g600);text-wrap:pretty}
.hd.m h1{font-size:22px;line-height:31px}
.hd.s{padding-bottom:16px}

/* ListHeader */
.lh{display:flex;justify-content:space-between;align-items:center;padding:28px 24px 12px}
.lh h2{font-size:18px;font-weight:700;letter-spacing:-.2px}
.lh .acc{border:0;background:none;font-size:14px;font-weight:500;color:var(--g600);display:flex;align-items:center;gap:2px}
.lh .cap{font-size:14px;color:var(--g500)}
.divider{height:12px;background:var(--g50);flex-shrink:0}
.hr{height:1px;background:var(--g100);margin:0 24px}

/* Buttons / CTA */
.cta{flex-shrink:0;padding:12px 20px calc(16px + var(--sab));background:#fff;position:relative}
.cta::before{content:'';position:absolute;left:0;right:0;top:-24px;height:24px;background:linear-gradient(rgba(255,255,255,0),#fff);pointer-events:none}
.btn{display:flex;align-items:center;justify-content:center;gap:6px;height:56px;width:100%;border-radius:16px;border:0;background:var(--primary);color:#fff;font-size:17px;font-weight:600;transition:background .15s,transform .1s}
.btn:active{background:var(--primary-press);transform:scale(.99)}
.btn:disabled{background:var(--g200);color:var(--g400);cursor:default;transform:none}
.btn.sec{background:var(--g100);color:var(--g800)}
.btn.sec:active{background:var(--g200)}
.btn.sm{height:44px;border-radius:12px;font-size:15px}
.btn.wh{background:#fff;color:var(--g900)}
.btn.wh:active{background:var(--g100)}
.btnrow{display:flex;gap:8px}
.btnrow .btn.sec{flex:0 0 auto;width:auto;padding:0 20px}
.txtbtn{display:block;border:0;background:none;color:var(--g600);font-size:15px;font-weight:500;padding:12px 0 0;width:100%;text-align:center}

/* Tab bar */
.tabbar{flex-shrink:0;display:flex;border-top:1px solid var(--g100);background:#fff;padding-bottom:var(--sab);transition:background-color .168s cubic-bezier(0,0,.58,1),border-color .168s cubic-bezier(0,0,.58,1)}
.tab{flex:1;height:60px;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--g400);font-size:11px;font-weight:600;border:0;background:none;transition:height .168s cubic-bezier(0,0,.58,1) 0s,color .156s cubic-bezier(0,0,.58,1)}
/* 펼칠 때: 바·아이콘·글자가 함께 천천히 (ease-out) */
.tab svg{flex-shrink:0;transition:transform .144s cubic-bezier(0,0,.58,1) .018s}
.tab .tl{display:block;line-height:14px;max-height:18px;margin-top:4px;overflow:hidden;opacity:1;transition:max-height .156s cubic-bezier(0,0,.58,1) .012s,margin-top .156s cubic-bezier(0,0,.58,1) .012s,opacity .12s cubic-bezier(0,0,.58,1) .06s}
.tab.on{color:var(--g900)}

/* Choice */
.choices{display:flex;flex-direction:column;gap:12px;padding:0 24px}
.choice{display:flex;align-items:center;gap:14px;padding:18px 20px;border-radius:16px;border:1.5px solid var(--g200);background:#fff;width:100%;text-align:left;transition:border-color .15s,background .15s}
.choice .em{font-size:26px;line-height:1;width:30px;text-align:center}
.choice .t{font-size:17px;font-weight:600;color:var(--g700)}
.choice .d{font-size:14px;color:var(--g500);margin-top:3px}
.choice .ck{margin-left:auto;color:var(--g300);flex-shrink:0}
.choice.on{border-color:var(--g900);background:var(--g50)}
.choice.on .t{color:var(--g900)}
.choice.on .ck{color:var(--primary)}

/* taste tiles */
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:0 24px}
.tile{position:relative;border-radius:16px;overflow:hidden;aspect-ratio:1/1.12;border:0;background:#222;padding:0;text-align:left}
.tile img{width:100%;height:100%;object-fit:cover;transition:transform .3s}
.tile .ov{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,0) 45%,rgba(0,0,0,.72));display:flex;flex-direction:column;justify-content:flex-end;padding:14px;color:#fff}
.tile .ov b{font-size:16px;font-weight:700}
.tile .ov span{font-size:12px;opacity:.85;margin-top:2px}
.tile .ck{position:absolute;top:10px;right:10px;width:26px;height:26px;border-radius:50%;border:2px solid rgba(255,255,255,.9);background:rgba(0,0,0,.2);display:flex;align-items:center;justify-content:center;color:transparent}
.tile.on{box-shadow:0 0 0 3px var(--primary)}
.tile.on .ck{background:var(--primary);border-color:var(--primary);color:#fff}

/* Switch */
.sw{width:50px;height:30px;border-radius:15px;background:var(--g300);position:relative;transition:background .2s;flex-shrink:0;border:0}
.sw::after{content:'';position:absolute;left:3px;top:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.2);transition:left .2s}
.sw.on{background:var(--primary)}
.sw.on::after{left:23px}

/* List rows */
.row{display:flex;align-items:center;gap:14px;padding:12px 24px;min-height:60px;width:100%;background:none;border:0;text-align:left}
.row:active{background:var(--g50)}
.row .tx{flex:1;min-width:0}
.row .t{font-size:16px;font-weight:500;color:var(--g800)}
.row .sub{font-size:13px;color:var(--g500);margin-top:3px;line-height:19px}
.row .v{font-size:15px;color:var(--g500);display:flex;align-items:center;gap:2px;flex-shrink:0}
.row .em{font-size:22px;width:28px;text-align:center}
.row .thumb{width:48px;height:48px;border-radius:10px;object-fit:cover;flex-shrink:0}

/* Badges & chips */
.badge{display:inline-flex;align-items:center;height:24px;padding:0 8px;border-radius:6px;font-size:12px;font-weight:600;background:var(--g100);color:var(--g600);white-space:nowrap}
.badge.or{background:var(--g800);color:#fff}
.chips{display:flex;gap:8px;padding:0 24px 20px;overflow-x:auto;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chips::after{content:'';flex:0 0 16px}
.chips.wrap{flex-wrap:wrap;overflow:visible}
.chips.wrap::after{display:none}
.chip{flex-shrink:0;height:36px;padding:0 14px;border-radius:18px;background:var(--g100);color:var(--g700);font-size:14px;font-weight:500;border:0;white-space:nowrap}
.chip.on{background:var(--g900);color:#fff;font-weight:600}
.chips.fit{gap:6px;overflow:visible}
.chips.fit::after{display:none}
.chips.fit .chip{flex:1 1 0;min-width:0;padding:0 4px;font-size:14px}
.pv-wrap{display:flex;flex-direction:column;align-items:center;padding:4px 24px 0}
.pv-phone{position:relative;width:212px;aspect-ratio:9/19.5;border-radius:30px;overflow:hidden;border:6px solid #16181c;background:#000;padding:0;box-shadow:0 14px 34px rgba(0,0,0,.18);color:rgb(var(--tx,255,255,255));text-align:left;transition:transform .15s}
.pv-phone:active{transform:scale(.98)}
.pv-phone .bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.pv-phone .shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(var(--tt),.42) 0%,rgba(var(--tt),0) 30%,rgba(var(--tb),.58) 62%,rgba(var(--tb),.88) 100%)}
.pv-in{position:absolute;inset:0;display:flex;flex-direction:column;padding:22px 14px 14px}
.pv-time{font-size:40px;font-weight:200;line-height:1;letter-spacing:-1.5px;text-align:center;font-variant-numeric:tabular-nums}
.pv-date{text-align:center;font-size:10px;font-weight:500;margin-top:5px;opacity:.95}
.pv-sp{flex:1}
.pv-cat{align-self:flex-start;font-size:9.5px;font-weight:600;padding:3px 7px;border-radius:6px;background:rgba(255,255,255,.2);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.pv-q{margin-top:0;font-family:var(--serif);font-size:calc(14.5px * var(--qk,1));line-height:1.5;font-weight:600;text-shadow:0 1px 8px rgba(0,0,0,.45);display:-webkit-box;-webkit-line-clamp:6;-webkit-box-orient:vertical;overflow:hidden;animation:pvIn .35s ease}
.pv-cap{margin-top:14px;text-align:center;font-size:14px;color:var(--g700);line-height:1.55}
.pv-cap span{font-size:12.5px;color:var(--g500)}
@keyframes pvIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.seg{display:flex;background:var(--g100);border-radius:12px;padding:4px;margin:0 24px 16px}
.seg button{flex:1;height:36px;border-radius:9px;border:0;background:none;font-size:14px;font-weight:500;color:var(--g600)}
.seg button.on{background:#fff;color:var(--g900);font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.08)}

/* Toast */
#toast{position:absolute;left:20px;right:20px;bottom:calc(92px + var(--sab));z-index:120;display:flex;gap:10px;align-items:center;padding:14px 18px;background:rgba(51,61,75,.97);color:#fff;border-radius:16px;font-size:15px;font-weight:500;line-height:21px;opacity:0;transform:translateY(12px);transition:opacity .25s,transform .25s;pointer-events:none}
#toast.show{opacity:1;transform:none}
#toast .ti{color:#fff;flex-shrink:0;display:flex}

/* Bottom sheet */
#dim{position:absolute;inset:0;background:rgba(0,0,0,.45);z-index:100;opacity:0;transition:opacity .25s;pointer-events:none}
#dim.show{opacity:1;pointer-events:auto}
#sheet{position:absolute;left:0;right:0;bottom:0;z-index:101;background:#fff;border-radius:24px 24px 0 0;transform:translateY(105%);transition:transform .192s cubic-bezier(.2,.8,.2,1);max-height:90%;display:flex;flex-direction:column}
#sheet.show{transform:none}
#sheet .handle{width:40px;height:4px;border-radius:2px;background:var(--g300);margin:10px auto 2px;flex-shrink:0}
#sheet .shd{padding:18px 24px 16px}
#sheet .shd h3{font-size:20px;font-weight:700;line-height:28px}
#sheet .shd p{font-size:15px;color:var(--g600);margin-top:6px;line-height:22px}
#sheet .sbody{overflow-y:auto;flex:1}

/* System dialog (Android) */
#dlg{position:absolute;inset:0;z-index:110;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.5);padding:28px}
#dlg.show{display:flex;animation:fadeIn .2s}
#dlg .box{background:#fff;border-radius:28px;padding:28px 24px 12px;width:100%}
#dlg .ai{width:44px;height:44px;margin:0 auto 16px}
#dlg h4{font-size:18px;font-weight:600;text-align:center;line-height:26px}
#dlg p{font-size:14px;color:var(--g600);text-align:center;margin-top:10px;line-height:21px}
#dlg .acts{display:flex;justify-content:flex-end;gap:4px;margin-top:20px}
#dlg .acts button{border:0;background:none;color:var(--g900);font-size:15px;font-weight:600;padding:12px 14px;border-radius:20px}

/* ---------- Lock screen ---------- */
#lockLayer{position:absolute;inset:0;z-index:90;pointer-events:none}
.lock{position:absolute;inset:0;background:#000;color:rgb(var(--tx,255,255,255));overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;pointer-events:auto}
.lock.wake{animation:wake .7s ease}
@keyframes wake{from{opacity:0;filter:brightness(.2)}to{opacity:1;filter:none}}
.lock.gone{transition:transform .38s cubic-bezier(.3,.7,.2,1),opacity .38s;transform:translateY(-100%);opacity:.4}
.lock .bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:opacity .4s}
/* 잠금 해제: 글자들이 위로 빠지고 그림만 → 흰색 → 앱 화면 (모두 ease-out) */
.lock.leaving .inner{transition:transform .3s cubic-bezier(.2,.8,.2,1),opacity .3s cubic-bezier(.2,.8,.2,1)!important;transform:translateY(-70px)!important;opacity:0!important;pointer-events:none}
.lock.leaving .shade,.lock.leaving .lk-panel{transition:opacity .3s cubic-bezier(.2,.8,.2,1);opacity:0}
.lk-white{position:absolute;inset:0;background:#fff;opacity:0;transition:opacity .18s cubic-bezier(.2,.8,.2,1);z-index:20;pointer-events:none}
.lk-white.on{opacity:1}
/* 가로 맞춤: 그림을 화면 폭에 맞추고, 위·아래는 그림 가장자리 주조색으로 쭉 이어지게 (그림 위아래 끝 25%는 그 색으로 스르륵 녹아요) */
.lock.fitw,.pv-phone.fitw{background:linear-gradient(180deg,rgb(var(--et,0,0,0)) 0 50%,rgb(var(--eb,0,0,0)) 50% 100%)}
.lock.fitw.fc-top,.pv-phone.fitw.fc-top{background:rgb(var(--et,0,0,0))} /* 위아래 모두 위 색상 */
.lock.fitw.fc-bottom,.pv-phone.fitw.fc-bottom{background:rgb(var(--eb,0,0,0))} /* 위아래 모두 아래 색상 */
.lock.fitw .bg,.pv-phone.fitw .bg{inset:auto;left:0;right:0;top:50%;width:100%;height:auto;max-height:none;object-fit:contain;transform:translateY(-50%);-webkit-mask-image:linear-gradient(180deg,transparent 0,#000 25%,#000 75%,transparent 100%);mask-image:linear-gradient(180deg,transparent 0,#000 25%,#000 75%,transparent 100%)}
.lock.frame.fb-blur .bg{filter:blur(30px) brightness(.5) saturate(1.25);transform:scale(1.25)}
.lock .shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(var(--tt),.45) 0%,rgba(var(--tt),.06) 26%,rgba(var(--tt),0) 40%,rgba(var(--tb),.62) 70%,rgba(var(--tb),.88) 100%)}
.lock.frame .shade{background:linear-gradient(180deg,rgba(0,0,0,.2),rgba(0,0,0,.35))}
.lock .inner{position:absolute;inset:0;display:flex;flex-direction:column;padding:calc(var(--sat) + 30px) var(--px,28px) calc(var(--sab) + 20px);transition:transform .25s}
.lk-time{font-size:86px;font-weight:200;line-height:1;letter-spacing:-3px;text-align:center;font-variant-numeric:tabular-nums}
.lk-date{text-align:center;font-size:17px;font-weight:500;margin-top:10px;opacity:.95}
.lk-count{align-self:center;margin-top:14px;font-size:13px;font-weight:500;padding:6px 12px;border-radius:999px;background:rgba(255,255,255,.16);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px)}
.lk-notis{position:relative;z-index:4;display:flex;flex-direction:column;gap:8px;margin-top:18px}
.lk-notis:empty{display:none}
.lk-notis.abs{position:absolute;left:var(--px,28px);right:var(--px,28px);margin:0}
.lk-noti .nd{margin-top:2px;font-size:14px;line-height:19px;opacity:.88;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;word-break:break-all}
.lk-noti.real .nb{font-size:15px}
.lk-noti.real .ai{border-radius:10px !important;object-fit:cover}
.lk-nmore{align-self:center;padding:5px 12px;border-radius:12px;background:rgba(255,255,255,.18);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);color:#fff;font-size:12.5px;font-weight:600}
.lk-noti{position:relative;z-index:4;margin-top:0;display:flex;gap:12px;align-items:flex-start;padding:14px 14px 14px 14px;border-radius:22px;background:rgba(255,255,255,.18);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);border:0;color:#fff;text-align:left;width:100%;animation:notiIn .3s .3s both cubic-bezier(.2,.8,.2,1)}
@keyframes notiIn{from{opacity:0;transform:translateY(-10px) scale(.97)}to{opacity:1;transform:none}}
.lk-noti .ai{width:36px;height:36px;border-radius:10px;flex-shrink:0}
.lk-noti .nt{flex:1;min-width:0}
.lk-noti .nh{display:flex;justify-content:space-between;font-size:12px;opacity:.85}
.lk-noti .nb{font-size:15px;font-weight:600;margin-top:3px;line-height:21px}
.lk-noti .nx{margin-left:6px;width:22px;height:22px;border-radius:50%;background:rgba(255,255,255,.2);border:0;color:#fff;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.lk-sp{flex:1;min-height:12px}
/* 크기 조정 모드의 그림은 다른 요소와 상관없이 화면 정가운데에 고정 */
.lk-frame{position:absolute;left:var(--px,28px);right:var(--px,28px);top:50%;height:44%;transform:translateY(-50%);margin:0;display:flex;justify-content:center;align-items:center;min-height:0;z-index:1}
.lk-frame img{box-sizing:border-box;max-width:var(--fs,100%);max-height:var(--fs,100%);object-fit:contain;box-shadow:0 18px 40px rgba(0,0,0,.45);align-self:center}
.lk-quote{margin-top:12px}
.lk-quote .cat{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;padding:5px 10px;border-radius:8px;background:rgba(255,255,255,.18);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.lk-quote p{margin-top:0;font-family:var(--serif);font-size:calc(28px * var(--qk,1));line-height:1.52;font-weight:600;letter-spacing:-.3px;text-shadow:0 2px 14px rgba(0,0,0,.4);text-wrap:pretty}
.lock.big .lk-quote p{font-size:calc(31px * var(--qk,1))}
.lock.pan .lk-quote,.lock.pan .lk-art,.lock.pan .lk-actions,.lock.pan .lk-unlock,.lock.pan .lk-frame{opacity:0;pointer-events:none;transition:opacity .2s}
.lock.frame .lk-quote p{font-size:calc(23px * var(--qk,1))}
.lock.frame.big .lk-quote p{font-size:calc(28px * var(--qk,1))}
.lk-art{margin-top:18px;display:inline-flex;align-items:center;gap:10px;padding:5px 12px 5px 5px;border-radius:999px;background:rgba(255,255,255,.16);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);color:#fff;border:0;font-size:13px;font-weight:500;max-width:100%}
.lk-art img{width:30px;height:30px;border-radius:50%;object-fit:cover;flex-shrink:0}
.lk-art span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lock.frame .lk-art{align-self:center}
.lk-actions{display:flex;justify-content:center;gap:30px;margin-top:22px}
.lk-act{display:flex;flex-direction:column;align-items:center;gap:7px;font-size:12px;font-weight:500;color:#fff;background:none;border:0}
.lk-act .c{width:54px;height:54px;border-radius:50%;background:rgba(255,255,255,.17);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);display:flex;align-items:center;justify-content:center;transition:background .2s,color .2s,transform .15s}
.lk-act:active .c{transform:scale(.92)}
.lk-act.on .c{background:#fff;color:var(--primary)}
.wl{margin-top:20px;align-self:flex-start;max-width:calc(86% * var(--lw,1));display:flex;flex-direction:column;padding:0;border:0;background:none;color:rgb(var(--tx,255,255,255));text-align:left;font-family:var(--lf,var(--sans));font-variant-numeric:tabular-nums}
.wl span{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wl.pv{zoom:calc(.56 * var(--lk,1));max-width:100%}
/* 1. 썸네일 칩 */
.wl.st-pill{margin-top:18px;align-self:stretch;max-width:100%;flex-direction:row;align-items:center;gap:10px;padding:5px 12px 5px 5px;border-radius:999px;background:rgba(255,255,255,.16);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);font-size:13px;font-weight:500}
.wl.st-pill img{width:30px;height:30px;border-radius:50%;object-fit:cover;flex-shrink:0}
.wl.st-pill span{flex:1;min-width:0}
/* 2. 한 줄 */
.wl.st-one{margin-top:14px;font-size:13px;font-weight:500;opacity:.78;text-shadow:0 1px 8px rgba(0,0,0,.4)}
/* 3. 두 줄 */
.wl.st-two{margin-top:16px;gap:3px;text-shadow:0 1px 8px rgba(0,0,0,.4)}
.wl.st-two .t{font-size:16px;font-weight:600;opacity:.95}
.wl.st-two .m{font-size:13px;font-weight:500;opacity:.72}
/* 4. 흰 카드 / 5. 라벨 (작가 → 「작품명」, 연도 → 원제 → 소장처) */
.wl.st-card{margin-top:18px;max-width:78%;padding:12px 14px 11px;border-radius:2px;background:#FBFAF7;color:#1B1B1B;box-shadow:0 6px 18px rgba(0,0,0,.28),0 1px 2px rgba(0,0,0,.2)}
.wl.st-card .wa,.wl.st-plain .wa{font-size:13px;font-weight:700;letter-spacing:-.1px}
.wl.st-card .wt,.wl.st-plain .wt{font-size:13px;margin-top:2px}
.wl.st-card .we,.wl.st-plain .we{font-size:11.5px;font-style:italic;margin-top:2px}
.wl.st-card .wr,.wl.st-plain .wr{width:18px;height:1px;margin:8px 0 6px}
.wl.st-card .wm,.wl.st-plain .wm{font-size:11px}
.wl.st-card .we,.wl.st-card .wm{color:#6B6B6B}
.wl.st-card .wr{background:#1B1B1B;opacity:.35}
.wl.st-plain{margin-top:18px;max-width:85%;text-shadow:0 1px 8px rgba(0,0,0,.45)}
.wl.st-plain .wa,.wl.st-plain .wt{font-size:14px}
.wl.st-plain .wt{opacity:.95}
.wl.st-plain .we,.wl.st-plain .wm{font-size:12px;opacity:.7}
.wl.st-plain .wr{background:#fff;opacity:.55}
/* 6. 세로선 라벨 (작품명 → 원제 → 작가, 연도 → 소장처) */
.wl.st-line{margin-top:22px;padding:1px 0 1px 11px;border-left:1.5px solid rgba(255,255,255,.7);text-shadow:0 1px 6px rgba(0,0,0,.35)}
.wl.st-line .wt{font-size:15px;font-weight:600;letter-spacing:-.2px;line-height:20px}
.wl.st-line .we{font-size:11.5px;font-style:italic;letter-spacing:.1px;line-height:16px;opacity:.62}
.wl.st-line .wa{font-size:12.5px;font-weight:500;line-height:17px;margin-top:7px;opacity:.88}
.wl.st-line .wm{font-size:11.5px;line-height:16px;opacity:.62}
/* ===== 그림 표시: 크기 조정 · 테두리 · 뒷배경 ===== */
.lock,.pv-phone{--tt:0,0,0;--tb:0,0,0;--tm:30,30,32;--g1:44,44,48;--g2:18,18,20}
.frame:not(.fb-blur) .bg{display:none}
.frame:not(.fb-blur) .shade{display:none}
.frame.fb-tint{background:rgb(var(--tm))}
.frame.fb-grad{background:linear-gradient(180deg,rgb(var(--g1)) 0%,rgb(var(--g2)) 100%)}
.frame.fb-black{background:#000}
.frame.fb-paper{background:#EEE8DC}
.pv-phone.frame.fb-blur .bg{filter:blur(14px) brightness(.5) saturate(1.25);transform:scale(1.25)}
.pv-phone.frame .shade{background:linear-gradient(180deg,rgba(0,0,0,.2),rgba(0,0,0,.35))}
.pv-frame{position:absolute;left:14px;right:14px;top:50%;height:44%;transform:translateY(-50%);min-height:0;display:flex;justify-content:center;align-items:center;margin:0;z-index:1}
.pv-frame img{box-sizing:border-box;max-width:var(--fs,100%);max-height:var(--fs,100%);object-fit:contain;box-shadow:0 8px 18px rgba(0,0,0,.45)}
/* 액자 스타일 (잠금화면 / 미리보기 0.55배) */
.frame.bd-none .lk-frame img{border:0}
.frame.bd-none .pv-frame img{border:0}
.frame.bd-line .lk-frame img{border:1.5px solid rgba(255,255,255,.9)}
.frame.bd-line .pv-frame img{border:1px solid rgba(255,255,255,.9)}
.frame.bd-mat .lk-frame img{border:7px solid #F4EFE6}
.frame.bd-mat .pv-frame img{border:3.9px solid #F4EFE6}
.frame.bd-wood .lk-frame img{padding:9px;background:#F4EFE6;border:7px solid #3A2A1C;box-shadow:inset 0 0 0 1px rgba(0,0,0,.08),0 18px 40px rgba(0,0,0,.45)}
.frame.bd-wood .pv-frame img{padding:5px;background:#F4EFE6;border:3.9px solid #3A2A1C;box-shadow:inset 0 0 0 1px rgba(0,0,0,.08),0 9.9px 22px rgba(0,0,0,.45)}
.frame.bd-oak .lk-frame img{padding:10px;background:#F6F1E7;border:8px solid #C9A578;box-shadow:inset 0 0 6px rgba(0,0,0,.12),0 18px 40px rgba(0,0,0,.4)}
.frame.bd-oak .pv-frame img{padding:5.5px;background:#F6F1E7;border:4.4px solid #C9A578;box-shadow:inset 0 0 3.3px rgba(0,0,0,.12),0 9.9px 22px rgba(0,0,0,.4)}
.frame.bd-gold .lk-frame img{padding:8px;background:#EFE6D2;border:10px solid;border-image:linear-gradient(135deg,#7A5A1E,#E9C86B 22%,#9C7428 40%,#F4DC8C 58%,#8A6420 78%,#D9B45A) 1;box-shadow:inset 0 0 5px rgba(80,50,0,.25),0 18px 40px rgba(0,0,0,.5)}
.frame.bd-gold .pv-frame img{padding:4.4px;background:#EFE6D2;border:5.5px solid;border-image:linear-gradient(135deg,#7A5A1E,#E9C86B 22%,#9C7428 40%,#F4DC8C 58%,#8A6420 78%,#D9B45A) 1;box-shadow:inset 0 0 2.8px rgba(80,50,0,.25),0 9.9px 22px rgba(0,0,0,.5)}
.frame.bd-black .lk-frame img{padding:16px;background:#FAFAF8;border:4px solid #111;box-shadow:inset 0 0 0 1px rgba(0,0,0,.06),0 16px 36px rgba(0,0,0,.45)}
.frame.bd-black .pv-frame img{padding:8.8px;background:#FAFAF8;border:2.2px solid #111;box-shadow:inset 0 0 0 1px rgba(0,0,0,.06),0 8.8px 19.8px rgba(0,0,0,.45)}
.frame.bd-white .lk-frame img{padding:12px;background:#FFFFFF;border:6px solid #F2F2F0;outline:1px solid rgba(0,0,0,.08);box-shadow:inset 0 1px 6px rgba(0,0,0,.14),0 16px 36px rgba(0,0,0,.4)}
.frame.bd-white .pv-frame img{padding:6.6px;background:#FFFFFF;border:3.3px solid #F2F2F0;outline:1px solid rgba(0,0,0,.08);box-shadow:inset 0 1px 3.3px rgba(0,0,0,.14),0 8.8px 19.8px rgba(0,0,0,.4)}
.frame.bd-float .lk-frame img{border:0;box-shadow:3px 3px 0 rgba(0,0,0,.35),6px 6px 0 rgba(0,0,0,.18),0 24px 48px rgba(0,0,0,.6)}
.frame.bd-float .pv-frame img{border:0;box-shadow:1.7px 1.7px 0 rgba(0,0,0,.35),3.3px 3.3px 0 rgba(0,0,0,.18),0 13.2px 26.4px rgba(0,0,0,.6)}
.frame.bd-polaroid .lk-frame img{padding:9px 9px 34px;background:#FDFDFB;border:0;box-shadow:0 14px 30px rgba(0,0,0,.45)}
.frame.bd-polaroid .pv-frame img{padding:5px 5px 18.7px;background:#FDFDFB;border:0;box-shadow:0 7.7px 16.5px rgba(0,0,0,.45)}
.frame.fb-paper .lk-frame img{box-shadow:0 10px 26px rgba(60,45,25,.22)}
.frame.fb-paper .pv-frame img{box-shadow:0 6px 14px rgba(60,45,25,.22)}
.frame.fb-paper.bd-line .lk-frame img,.frame.fb-paper.bd-line .pv-frame img{border-color:rgba(0,0,0,.35)}
.frame.fb-paper.bd-mat .lk-frame img,.frame.fb-paper.bd-mat .pv-frame img{border-color:#fff}
/* 종이 배경일 땐 글자를 어둡게 */
.lock.light,.pv-phone.light{color:#1F1D1A}
/* 문장·작품정보 드롭섀도: 가까운 그림자 + 넓은 그림자, 색은 아래 주조색을 아주 어둡게 (--ts) */
.lk-quote p,.pv-q{text-shadow:0 1px 2px rgba(var(--ts,0,0,0),.6),0 2px 14px rgba(var(--ts,0,0,0),.5)}
.wl,.wl.st-one,.wl.st-two,.wl.st-plain,.wl.st-line,.wl.st-pill{text-shadow:0 1px 2px rgba(var(--ts,0,0,0),.6),0 1px 10px rgba(var(--ts,0,0,0),.5)}
.lock.light .lk-quote p,.pv-phone.light .pv-q,.lock.light .wl,.pv-phone.light .wl{text-shadow:none;color:#1F1D1A}
.lock.light .lk-unlock{color:#1F1D1A}
.lock.light .lk-noti{background:rgba(0,0,0,.07);color:#1F1D1A}
.lock.light .lk-noti .nx{background:rgba(0,0,0,.1);color:#1F1D1A}
.light .wl.st-line{border-left-color:rgba(0,0,0,.45)}
.light .wl.st-plain .wr{background:#000;opacity:.35}
.light .wl.st-pill{background:rgba(0,0,0,.07)}
.pv-val{float:right;font-weight:500;color:var(--g500);font-size:14px}
.rng-wrap{display:flex;align-items:center;gap:12px;padding:0 24px 18px;font-size:12.5px;color:var(--g500)}
.rng{flex:1;accent-color:var(--g900);height:28px}
.chip.fchip{font-size:15px;font-weight:600}
/* 잠금화면 시계 */
.ck{display:flex;flex-direction:column;align-items:center;text-align:center;margin-top:var(--co,0px);font-variant-numeric:lining-nums tabular-nums;font-feature-settings:"lnum" 1,"tnum" 1}
/* 시계 정렬 = 시계 안의 시간·날짜 텍스트 정렬 (시계 자리는 그대로) */
.ck{align-self:center}
.ck.al-center{align-items:center;text-align:center}
.ck.al-left{align-items:flex-start;text-align:left}
.ck.al-right{align-items:flex-end;text-align:right}
div.ck{color:rgb(var(--txt,var(--tx,255,255,255)))}
.ck .t{font-family:var(--cf,var(--sans));font-weight:var(--cw,200);font-size:var(--cs,86px);line-height:1;letter-spacing:-.035em}
.ck.fm-stack .t{display:flex;flex-direction:column;line-height:.9}
.ck .dt{font-family:var(--cf,var(--sans));font-size:max(13px,calc(var(--cs,86px) * .2));font-weight:500;margin-top:calc(var(--cs,86px) * .11);opacity:.95;letter-spacing:0}
.ck:not(.cf-thin):not(.cf-regular):not(.cf-bold) .dt{font-weight:var(--cw)}
.ck.cf-cormorant .t,.ck.cf-playfair .t,.ck.cf-ebg .t,.ck.cf-caslon .t{letter-spacing:-.01em}
.ck.pv{zoom:.47}
/* ===== 잠금화면 꾸미기 탭 ===== */
.ed{position:absolute;inset:0;background:#000;overflow:hidden}
.ed-panel{position:absolute;left:0;right:0;top:0;padding-top:var(--sat);z-index:4;display:flex;flex-direction:column;background:rgba(16,17,21,.93);border-radius:0 0 18px 18px;color:#fff} /* 꾸미기 조작 메뉴: 화면 맨 위 · 흐림(backdrop-filter) 대신 단색 반투명 — 사각형 깨짐 방지 */
.ed-tools{display:flex;flex-shrink:0;height:44px;padding:2px 6px 0}
.ed-tools button{flex:1;border:0;background:none;color:rgba(255,255,255,.55);font-size:14px;font-weight:600;position:relative;text-shadow:0 1px 4px rgba(0,0,0,.3)}
.ed-tools button.on{color:#fff}
.ed-tools button.on::after{content:'';position:absolute;left:32%;right:32%;bottom:5px;height:2px;border-radius:1px;background:#fff}
/* 옵션: 왼쪽 이름 + 오른쪽 한 줄(칩/슬라이더). 세 줄 정도만 보이고 나머지는 스크롤 */
.ed-body{flex:none;height:0;overflow-y:auto;transition:height .15s cubic-bezier(.2,.8,.2,1);display:grid;grid-template-columns:70px minmax(0,1fr);align-items:center;row-gap:6px;padding:0 0 0 16px;align-content:start}
.ed.open .ed-body{height:132px;padding-top:8px;padding-bottom:8px}
.ed-panel .pv-sub{margin:0;color:rgba(255,255,255,.62);font-size:12.5px;font-weight:600;line-height:1.25}
.ed-panel .pv-val{float:none;display:block;color:rgba(255,255,255,.45);font-size:11px;font-weight:500;margin-top:1px}
.ed-panel .chips{padding:0 16px 0 0;gap:6px;min-height:36px;align-items:center}
.ed-panel .chips::after{flex:0 0 4px}
.ed-panel .chip{height:32px;padding:0 12px;font-size:13px;background:rgba(255,255,255,.14);color:rgba(255,255,255,.9)}
.ed-panel .chip.fchip{font-size:14px}
.ed-panel .chip.on{background:#fff;color:#111}
.ed-panel .rng-wrap{padding:0 16px 0 0;min-height:36px;gap:8px;color:rgba(255,255,255,.5);font-size:11.5px}
.ed-panel .rng{accent-color:#fff;height:24px}
.ed-hint{grid-column:1/-1;margin:10px 16px 6px 0;font-size:14px;line-height:1.6;color:rgba(255,255,255,.75)}
.ed-hint button{display:block;margin-top:8px;height:34px;padding:0 16px;border-radius:19px;border:0;background:#fff;color:#111;font-size:14px;font-weight:600}
.tabbar.abs{position:absolute;left:0;right:0;bottom:0;z-index:3}
.tabbar.dark{}
/* 접을 때: 글자 → 아이콘 → 바 순서 (ease-out, 빠르게) */
.tabbar.dark .tab{height:34px;transition:height .12s cubic-bezier(0,0,.58,1) .06s}
.tabbar.dark .tab .tl{opacity:0;max-height:0;margin-top:0;transition:opacity .072s cubic-bezier(0,0,.58,1) 0s,max-height .108s cubic-bezier(0,0,.58,1) .03s,margin-top .108s cubic-bezier(0,0,.58,1) .03s}
.tabbar.dark .tab svg{transform:scale(.833);transition:transform .096s cubic-bezier(0,0,.58,1) .036s}
.tabbar.instant,.tabbar.instant *{transition:none!important}
.ed-link{display:flex;align-items:center;gap:12px;width:calc(100% - 48px);margin:18px 24px 0;padding:14px 16px;border:0;border-radius:16px;background:var(--g50);color:var(--g900);text-align:left}
.ed-link>span{width:40px;height:40px;border-radius:12px;background:var(--g900);color:#fff;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.ed-link div{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.ed-link b{font-size:15.5px;font-weight:700}
.ed-link small{font-size:12.5px;color:var(--g500)}
/* 작품 정보 위치 */
.wl.pos-free{position:absolute;margin:0;z-index:2;max-width:72%}
.lk-frame.has-lbl .wl,.pv-frame.has-lbl .wl{position:absolute;left:50%;top:100%;margin:0;max-width:92%;transform:translateX(-50%);visibility:hidden}
.lk-frame.has-lbl .wl.placed,.pv-frame.has-lbl .wl.placed{visibility:visible}
.chip.dim{opacity:.38}
/* 꾸미기: 요소 선택 (검은 테두리 + 오른쪽 위 이동 핸들) */
.ed-lock [data-el]{cursor:pointer}
.ed-lock .ck,.ed-lock .lk-quote,.ed-lock .wl{position:relative}
.ed-lock .ck.pos-free,.ed-lock .lk-quote.pos-free,.ed-lock .wl.pos-free{position:absolute}
.ed-lock .sel::after{content:'';position:absolute;inset:-8px;border:1.5px solid #111;border-radius:6px;box-shadow:0 0 0 1px rgba(255,255,255,.55),inset 0 0 0 1px rgba(255,255,255,.55);pointer-events:none}
.ed-lock .lk-frame.sel::after{display:none}
.ed-lock .lk-frame.sel img{outline:1.5px solid #111;outline-offset:6px;box-shadow:0 0 0 7.5px rgba(255,255,255,.55),0 18px 40px rgba(0,0,0,.45)}
.ed-lock .mv{position:absolute;top:-19px;right:-19px;z-index:3;width:22px;height:22px;border-radius:50%;background:#111;color:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 1.5px rgba(255,255,255,.75),0 2px 6px rgba(0,0,0,.35);touch-action:none;cursor:grab;font-style:normal}
.ed-lock .wl.pos-free{outline:none}
/* 작품 정보 크기 (편집·잠금화면 공통) */
.wl:not(.pv){zoom:var(--lk,1)}
/* 크기 조정 손잡이: 선택 테두리(-8px) 위 가운데, 눈금 3줄 */
.ed-lock .rz{position:absolute;z-index:4;background:#fff;border:1.5px solid #111;border-radius:4px;box-shadow:0 1px 4px rgba(0,0,0,.3);touch-action:none;font-style:normal}
.ed-lock .rz-l,.ed-lock .rz-r{top:50%;width:9px;height:26px;transform:translate(-50%,-50%);cursor:ew-resize;background:#fff repeating-linear-gradient(90deg,transparent 0 1.5px,#111 1.5px 2.5px,transparent 2.5px 3.5px) center/4px 12px no-repeat}
.ed-lock .rz-l{left:-8px}
.ed-lock .rz-r{left:calc(100% + 8px)}
.ed-lock .rz-t,.ed-lock .rz-b{left:50%;width:26px;height:9px;transform:translate(-50%,-50%);cursor:ns-resize;background:#fff repeating-linear-gradient(0deg,transparent 0 1.5px,#111 1.5px 2.5px,transparent 2.5px 3.5px) center/12px 4px no-repeat}
.ed-lock .rz-t{top:-8px}
.ed-lock .rz-b{top:calc(100% + 8px)}
.ed-lock .lk-blk .rz-l{left:-5px}.ed-lock .lk-blk .rz-r{left:calc(100% + 5px)}
.ed-lock .lk-blk .rz-t{top:-5px}.ed-lock .lk-blk .rz-b{top:calc(100% + 5px)}
.ed-lock .resizing{transition:none}
/* 정렬 버튼: 선택 테두리 위쪽 가운데 */
.ed-lock .al-bar{position:absolute;left:50%;top:-8px;transform:translate(-50%,calc(-100% - 10px));z-index:4;display:flex;gap:2px;padding:3px;border-radius:9px;background:#16181C;box-shadow:0 0 0 1px rgba(255,255,255,.55),0 2px 8px rgba(0,0,0,.35);font-style:normal}
.ed-lock .lk-blk .al-bar{top:-5px}
.ed-lock div.ck > .al-bar{top:calc(100% + 8px);transform:translate(-50%,10px)} /* 시계는 화면 맨 위라 정렬 버튼을 아래쪽 테두리 밑에 */
.ed-lock .al-bar button{width:28px;height:24px;border:0;border-radius:6px;background:none;color:rgba(255,255,255,.6);display:flex;align-items:center;justify-content:center;padding:0}
.ed-lock .al-bar button.on{background:#fff;color:#111}
.ed-lock .dragging{opacity:.92}
.ck.pos-free,.lk-quote.pos-free,.pv-q.pos-free{position:absolute;margin:0;z-index:2}
.lk-quote.pos-free{width:calc((100% - 56px) * var(--qw,1))} /* 너비는 좌우 여백과 따로: 기준 = 화면폭 - 56px */
.pv-q.pos-free{width:calc(100% - 28px)}
/* 꾸미기: 패널 위 떠 있는 버튼 (눈 · 다른 그림) */
.ed-panel{transition:transform .156s cubic-bezier(0,0,.58,1),opacity .12s cubic-bezier(0,0,.58,1)}
.ed-fab{position:absolute;right:12px;top:calc(100% + 10px);display:flex;gap:8px;transition:transform .156s cubic-bezier(0,0,.58,1)}
.ed-fab button{width:36px;height:36px;border-radius:50%;border:0;background:rgba(22,24,28,.9);position:relative;z-index:1;color:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 8px rgba(0,0,0,.2)}
/* 숨김: 패널과 탭 바는 아래로 사라지고, 두 버튼만 화면 아래쪽에 남음 */
.ed.hide .ed-panel{transform:translateY(-100%);background:transparent;-webkit-backdrop-filter:none;backdrop-filter:none}
.ed.hide .ed-tools,.ed.hide .ed-body{opacity:0;pointer-events:none;transition:opacity .09s cubic-bezier(0,0,.58,1)}
.ed.hide .ed-fab{opacity:.25}
/* 위쪽 요소(시계)를 고르면 메뉴는 아래에서 올라와요 */
.ed.dock-b .ed-panel{top:auto;bottom:calc(34px + var(--sab));padding-top:0;border-radius:18px 18px 0 0}
.ed.dock-b .ed-fab{top:-46px}
.ed.dock-b.hide .ed-panel{transform:translateY(calc(100% + 34px + var(--sab)))}
.ed.dock-b.hide .ed-fab{transform:translateY(-64px)}
.ed-fab.ed-nav{right:auto;left:12px} /* 되돌리기·다시 실행: 같은 줄 왼쪽 끝, 같은 규격 */
.ed-fab button:disabled{opacity:.35;cursor:default}
.ed-fab{transition:transform .156s cubic-bezier(0,0,.58,1),opacity .12s cubic-bezier(0,0,.58,1)}
.ed.hide ~ .tabbar{transform:translateY(100%);opacity:0;pointer-events:none}
.tabbar.abs{transition:transform .156s cubic-bezier(0,0,.58,1),opacity .12s cubic-bezier(0,0,.58,1)}
.ed-tools{transition:opacity .12s cubic-bezier(0,0,.58,1) .036s}
.ed-panel .ed-body{transition:height .15s cubic-bezier(.2,.8,.2,1),opacity .12s cubic-bezier(0,0,.58,1) .036s}
/* 가로 정가운데 가이드라인 */
.snap-v{position:absolute;left:50%;top:0;bottom:0;width:0;border-left:1.5px solid #FF4D8D;transform:translateX(-.75px);opacity:0;transition:opacity .072s cubic-bezier(0,0,.58,1);pointer-events:none;z-index:4}
.snap-v.on{opacity:1}
/* 블록(그룹): 문장 + 작품 정보 */
.lk-blk{display:flex;flex-direction:column;align-items:stretch}
.lk-blk > .wl{align-self:flex-start}
/* 칸 너비 (좌우 손잡이): 문장 qw · 그룹 bw — 정렬에 맞춰 왼쪽/가운데/오른쪽에 붙어요 */
.lk-quote{width:min(calc((100% + 2 * var(--px,28px) - 56px) * var(--qw,1)), calc(100% + var(--px,28px) - 8px));align-self:flex-start}
.lk-blk .lk-quote{width:calc(var(--qw,1) * 100%)} /* 그룹 안에서는 그룹 칸 기준 */
.pv-q{max-width:calc(var(--qw,1) * 100%)}
.lk-blk:not(.pos-free){width:min(calc((100% + 2 * var(--px,28px) - 56px) * var(--bw,1)), calc(100% + var(--px,28px) - 8px));align-self:flex-start}
.qa-center .lk-quote,.qa-center .lk-blk:not(.pos-free){align-self:center}
.qa-right .lk-quote,.qa-right .lk-blk:not(.pos-free){align-self:flex-end}
.lk-blk > .lk-quote{align-self:flex-start}
.qa-center .lk-blk > .lk-quote{align-self:center}
.qa-right .lk-blk > .lk-quote{align-self:flex-end}
/* 문장·작품 정보 정렬 (좌·가운데·우) */
.qa-center .lk-quote p,.qa-center .pv-q{text-align:center}
.qa-right .lk-quote p,.qa-right .pv-q{text-align:right}
/* 작품 정보 칸 너비를 직접 조정한 경우: 내용 크기 대신 정한 너비 */
.wl.wset{max-width:none;width:min(calc((100% + 2 * var(--px,28px) - 56px) * var(--lw,1)), calc(100% + var(--px,28px) - 8px))}
.wl.wset.pos-free{width:calc((100% - 56px) * var(--lw,1))}
.lk-blk > .wl.wset{width:calc(100% * var(--lw,1))}
.la-center .wl,.la-center .lk-blk > .wl{align-self:center;align-items:center;text-align:center}
.la-right .wl,.la-right .lk-blk > .wl{align-self:flex-end;align-items:flex-end;text-align:right}
.lk-blk.pos-free{position:absolute;margin:0;z-index:2;width:calc((100% - 56px) * var(--bw,1))}
.lk-blk.pv.pos-free{width:calc((100% - 28px) * var(--bw,1))}
.lk-blk.pos-free > .lk-quote{margin-top:0}
.ed-lock .lk-blk{position:relative}
.ed-lock .lk-blk.pos-free{position:absolute}
.ed-lock .lk-blk.child-sel::before{content:'';position:absolute;inset:-8px;border:1px dashed rgba(255,255,255,.7);border-radius:6px;pointer-events:none}
.ed-lock .lk-blk .sel::after{inset:-5px}
/* 밀어서 열기 + 광고 영역 (잠금화면 바닥 고정 영역) */
.lock{--uz:calc(var(--sab) + 99px)}
.lk-unlock{transition:opacity .25s cubic-bezier(.42,0,1,1)}
/* '위로 밀어서 열기'는 원래 자리 그대로, 광고 뒤(아래 레이어)에 있어요 — 광고가 위를 덮어요 */
.lock .lk-unlock{position:relative;z-index:2}
.lk-ad{position:absolute;left:0;right:0;bottom:0;height:calc(50px + var(--sab));display:flex;align-items:center;gap:10px;padding:0 14px var(--sab);background:rgba(18,19,23,.78);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);color:#fff;opacity:0;transform:translateY(8px);transition:opacity .3s cubic-bezier(.42,0,1,1),transform .3s cubic-bezier(.42,0,1,1);pointer-events:none;z-index:3}
.lk-ad.show{opacity:1;transform:none;pointer-events:auto}
.lk-ad .ad-b{flex-shrink:0;font-size:10px;font-weight:700;padding:2px 5px;border-radius:4px;background:#F5C518;color:#111}
.lk-ad .ad-t{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.3}
.lk-ad .ad-t b{font-size:13px;font-weight:600}
.lk-ad .ad-t small{font-size:11px;opacity:.6}
.lk-ad .ad-i{font-size:13px;opacity:.6}
.unlock-zone{position:absolute;left:0;right:0;bottom:0;height:var(--uz);border-top:1px dashed rgba(255,255,255,.38);pointer-events:none;z-index:1}
.ed.hide .unlock-zone{opacity:0}
/* 꾸미기: 꾸미기 화면도 실제 잠금화면과 같은 아래 여백으로 (APK에서는 잠금화면이 하단 네비를 숨겨서 0) */
html.apk .ed-lock{--sab:0px}
/* 화면 좌우 여백 가이드: 점선 + 가운데 손잡이를 끌면 좌우가 같이 바뀌어요 */
.pad-g{position:absolute;top:calc(var(--sat) + 8px);bottom:var(--uz,99px);width:24px;margin-left:-12px;z-index:3;cursor:ew-resize;touch-action:none}
.pad-g::before{content:'';position:absolute;left:50%;top:0;bottom:0;border-left:1px dashed rgba(255,255,255,.4)}
.pad-g.l{left:var(--px,28px)}
.pad-g.r{left:calc(100% - var(--px,28px))}
.pad-g i{position:absolute;left:50%;top:50%;width:9px;height:26px;transform:translate(-50%,-50%);border-radius:4px;border:1.5px solid #111;box-shadow:0 1px 4px rgba(0,0,0,.3);background:#fff repeating-linear-gradient(90deg,transparent 0 1.5px,#111 1.5px 2.5px,transparent 2.5px 3.5px) center/4px 12px no-repeat;font-style:normal}
.pad-g b{position:absolute;left:50%;top:calc(50% - 30px);transform:translate(-50%,-100%);padding:3px 7px;border-radius:6px;background:#16181C;color:#fff;font-size:11px;font-weight:600;white-space:nowrap;opacity:0;transition:opacity .1s;pointer-events:none}
.pad-g.on b{opacity:1}
.pad-g.on::before{border-left:1.5px solid #FF4D8D}
.ed.hide .pad-g{opacity:0;pointer-events:none}
.pad-g.snap::before{border-left:1.5px solid #FF4D8D} /* 요소가 여백선에 붙으면 분홍색 */
.ed.hide .pad-g.snap{opacity:1}
.ed.hide .pad-g.snap i{display:none}
.unlock-zone{transition:opacity .12s cubic-bezier(0,0,.58,1)}
.unlock-zone .uz-l-unused{position:absolute;left:0;right:0;top:9px;display:flex;align-items:center;justify-content:center;gap:4px;font-size:11.5px;font-weight:600;color:rgba(255,255,255,.75);text-shadow:0 1px 4px rgba(0,0,0,.4)}
/* 완료 버튼 · 다중 선택 */
.ed-fab button.done{width:auto;padding:0 12px;border-radius:9px;font-size:13px;font-weight:600;background:#16181C;color:#fff;-webkit-backdrop-filter:none;backdrop-filter:none} /* 기기 선택 버튼과 같은 스타일: 검은 바탕·흰 글씨 */
.ed-lock .sel.multi::after{border-style:dashed;border-color:#111}
.ed-lock .ck.multi,.ed-lock .lk-quote.multi,.ed-lock .wl.multi,.ed-lock .lk-blk.multi{position:relative}
.ed-lock .lk-blk .ck{position:relative}
.lk-blk .ck{margin-top:0;align-self:stretch} /* 그룹 안 시계는 그룹 폭 기준으로 텍스트 정렬 */
.lk-blk > .ck + .lk-quote{margin-top:18px}
.pv-sub{margin:22px 24px 10px;font-size:15px;font-weight:600;color:var(--g800)}
.lk-unlock{margin-top:36px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:14px;font-weight:500;opacity:.9;border:0;background:none;color:rgb(var(--tx,255,255,255));align-self:center}
.lk-unlock .ch{animation:bob 1.6s infinite ease-in-out}
@keyframes bob{0%,100%{transform:translateY(2px);opacity:.6}50%{transform:translateY(-4px);opacity:1}}
.lk-panel{position:absolute;left:16px;right:16px;bottom:calc(var(--sab) + 16px);padding:22px 20px 18px;border-radius:26px;background:rgba(25,31,40,.72);-webkit-backdrop-filter:blur(24px);backdrop-filter:blur(24px);animation:panelIn .18s cubic-bezier(.2,.8,.2,1);z-index:3}
@keyframes panelIn{from{transform:translateY(30px);opacity:0}to{transform:none;opacity:1}}
.lk-panel h5{font-size:15px;font-weight:600;opacity:.9}
.lk-panel .tg{font-family:var(--serif);font-size:18px;line-height:1.55;margin-top:10px;opacity:.55}
.lk-panel input{margin-top:14px;width:100%;height:52px;border-radius:14px;border:1.5px solid rgba(255,255,255,.25);background:rgba(255,255,255,.1);color:#fff;padding:0 16px;font-size:16px;outline:none}
.lk-panel input:focus{border-color:#fff}
.lk-panel .prog{height:4px;border-radius:2px;background:rgba(255,255,255,.2);margin-top:12px;overflow:hidden}
.lk-panel .prog i{display:block;height:100%;background:#fff;width:0;transition:width .2s}
.lk-panel .row2{display:flex;justify-content:space-between;align-items:center;margin-top:12px;font-size:13px;opacity:.8}
.lk-panel .row2 button{border:0;background:none;color:#fff;font-size:13px;text-decoration:underline;opacity:.9}
.mic{width:76px;height:76px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;margin:18px auto 6px;position:relative;color:var(--g900)}
.mic::before,.mic::after{content:'';position:absolute;inset:0;border-radius:50%;background:#fff;opacity:.3;animation:pulse 1.6s infinite}
.mic::after{animation-delay:.8s}
.mic.done{background:#fff}
.mic.done::before,.mic.done::after{display:none}
@keyframes pulse{from{transform:scale(1);opacity:.4}to{transform:scale(1.9);opacity:0}}

/* ---------- Home ---------- */
.hero{margin:0 24px;border-radius:24px;overflow:hidden;position:relative;aspect-ratio:4/5;background:#222;border:0;padding:0;width:calc(100% - 48px);display:block;text-align:left}
.hero img{width:100%;height:100%;object-fit:cover}
.hero .ov{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,0) 38%,rgba(0,0,0,.78));display:flex;flex-direction:column;justify-content:flex-end;padding:24px;color:#fff}
.hero .q{font-family:var(--serif);font-size:22px;line-height:1.55;font-weight:600;text-wrap:pretty}
.hero .cap{margin-top:14px;font-size:13px;opacity:.88;display:flex;align-items:center;gap:6px}
.hero .cat{position:absolute;top:16px;left:16px;font-size:12px;font-weight:600;padding:5px 10px;border-radius:8px;background:rgba(0,0,0,.35);color:#fff;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.hero-acts{display:flex;gap:8px;padding:12px 24px 0}
/* 오늘 — 하루 한 장 */
.dy-hd{padding:6px 24px 18px}
.dy-hd h1{font-size:26px;line-height:34px;font-weight:700;letter-spacing:-.4px;color:var(--g900)}
.dy-hd p{margin-top:6px;font-size:15px;line-height:22px;color:var(--g600)}
.dy-ask{margin:0 20px;padding:22px 20px 18px;border-radius:22px;background:linear-gradient(160deg,#FBF7F0,#F3EEE6);box-shadow:inset 0 0 0 1px rgba(0,0,0,.04)}
.dy-ask .lb{display:inline-block;font-size:12px;font-weight:700;color:#8A6D3B;letter-spacing:.2px}
.dy-ask p{margin-top:8px;font-family:var(--serif);font-size:22px;line-height:1.5;font-weight:600;color:#2B2420;text-wrap:balance}
.dy-ask small{display:block;margin-top:8px;font-size:13px;color:#8C8378}
.dy-ask .acts{display:flex;gap:8px;margin-top:18px}
.dy-ask .btn{position:relative;flex:1;height:52px;font-size:16px;overflow:hidden;cursor:pointer}
.dy-ask .btn.sec{flex:0 0 36%;background:#fff}
.dy-ask .btn input{position:absolute;inset:0;opacity:0;cursor:pointer}
.dy-done{display:flex;gap:14px;margin:0 20px;padding:12px;border-radius:22px;background:var(--g50);cursor:pointer}
.dy-done .ph{position:relative;flex:0 0 112px;aspect-ratio:4/5;border-radius:14px;overflow:hidden;background:var(--g200)}
.dy-done .ph > img{width:100%;height:100%;object-fit:cover}
.dy-done .art{position:absolute;right:6px;bottom:6px;width:30px;height:38px;border-radius:5px;overflow:hidden;box-shadow:0 0 0 2px #fff,0 2px 8px rgba(0,0,0,.3)}
.dy-done .art img{width:100%;height:100%;object-fit:cover}
.dy-done .tx{flex:1;min-width:0;display:flex;flex-direction:column;padding:4px 2px}
.dy-done .tg{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:700;color:var(--primary)}
.dy-done b{margin-top:6px;font-size:18px;font-weight:700;color:var(--g900)}
.dy-done p{margin-top:4px;font-size:14px;line-height:21px;color:var(--g700);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.dy-done .mt{margin-top:auto;display:flex;align-items:center;gap:3px;font-size:12px;color:var(--g500)}
.dy-week{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;padding:16px 20px 4px}
.dw{display:flex;flex-direction:column;align-items:center;gap:4px;border:0;background:none;padding:0}
.dw .c{width:36px;height:36px;border-radius:50%;overflow:hidden;display:flex;align-items:center;justify-content:center;background:var(--g100);color:var(--g500)}
.dw .c img{width:100%;height:100%;object-fit:cover}
.dw.today .c{background:#fff;box-shadow:inset 0 0 0 1.5px var(--g900);color:var(--g900)}
.dw.today.has .c{box-shadow:0 0 0 2px #fff,0 0 0 3.5px var(--primary)}
.dw.fut .c{background:none;box-shadow:inset 0 0 0 1px var(--g200)}
.dw b{font-size:11px;font-weight:600;color:var(--g500)}
.dw.today b{color:var(--g900)}
.dw em{display:none}
.hero.sm{aspect-ratio:5/4}
.hero.sm .q{font-size:19px}
.dyw{padding-top:4px}
.dy-comp{margin:0 20px;border-radius:20px;overflow:hidden;background:#fff;box-shadow:0 6px 24px rgba(0,0,0,.10),0 0 0 1px rgba(0,0,0,.04)}
.dy-comp .ph{position:relative;aspect-ratio:4/5;background:var(--g100)}
.dy-comp .ph > img{width:100%;height:100%;object-fit:cover}
.dy-comp .re{position:absolute;right:10px;top:10px;display:inline-flex;align-items:center;gap:4px;height:30px;padding:0 10px;border-radius:15px;background:rgba(0,0,0,.5);color:#fff;font-size:12.5px;font-weight:600;overflow:hidden;cursor:pointer}
.dy-comp .re input{position:absolute;inset:0;opacity:0}
.dy-comp .pair{display:flex;gap:12px;align-items:center;padding:12px 14px}
.dy-comp .pair > img{flex:0 0 44px;height:56px;border-radius:6px;object-fit:cover}
.dy-comp .pair div{min-width:0}
.dy-comp .pair span{font-size:11px;font-weight:700;color:var(--g500)}
.dy-comp .pair b{display:block;font-size:14px;font-weight:700;color:var(--g900);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dy-comp .pair p{font-family:var(--serif);font-size:13px;line-height:19px;color:var(--g700);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.dy-pub{display:flex;align-items:center;gap:12px;width:calc(100% - 48px);margin:22px 24px 0;padding:14px 16px;border:0;border-radius:14px;background:var(--g50);text-align:left}
.dy-pub div{flex:1;min-width:0}
.dy-pub b{display:block;font-size:15px;font-weight:600;color:var(--g900)}
.dy-pub span{display:block;margin-top:2px;font-size:12.5px;color:var(--g500)}
.dy-pub .sw{flex:none;position:relative;width:44px;height:26px;border-radius:13px;background:var(--g300);transition:background .2s cubic-bezier(.2,.8,.2,1)}
.dy-pub .sw::after{content:'';position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.2);transition:transform .2s cubic-bezier(.2,.8,.2,1)}
.dy-pub.on .sw{background:var(--primary)}
.dy-pub.on .sw::after{transform:translateX(18px)}
.hero-acts .btn{flex:1}
.hero-acts .btn.icon{flex:0 0 52px;width:52px;padding:0}
.hero-acts .btn.icon.on{color:var(--primary)}
.statcard{margin:0 24px;padding:20px;border-radius:20px;background:var(--g50)}
.statcard .big{font-size:22px;font-weight:700;letter-spacing:-.3px}
.statcard .big em{font-style:normal;color:var(--primary)}
.statcard .sub{font-size:14px;color:var(--g600);margin-top:4px}
.week{display:flex;justify-content:space-between;margin-top:18px}
.week .d{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;color:var(--g500);font-weight:500}
.week .dot{width:34px;height:34px;border-radius:50%;background:var(--g200);display:flex;align-items:center;justify-content:center;color:#fff}
.week .d.done .dot{background:var(--primary)}
.week .d.today{color:var(--g900);font-weight:700}
.week .d.today .dot{box-shadow:0 0 0 2px #fff,0 0 0 4px var(--g900)}
.story{padding:0 24px;font-size:16px;line-height:1.75;color:var(--g700)}
.story p+p{margin-top:12px}
.clamp{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.writecard{margin:0 24px;padding:20px;border-radius:20px;border:1.5px solid var(--g200)}

.mini{position:relative;width:100%;aspect-ratio:390/844;overflow:hidden;border-radius:16px;background:#000;box-shadow:0 4px 14px rgba(0,0,0,.10),0 0 0 1px rgba(0,0,0,.04)}
.pf-group{position:relative}
.pf-group .mini.swap{position:absolute;left:0;top:0;width:100%} /* 다음 사진이 위에 겹쳐 스르륵 나타남 */
.mini-in{position:absolute;left:0;top:0;width:390px;height:844px;transform-origin:0 0;--sat:30px;--sab:0px}
.mini .lock{pointer-events:none}
/* 모든 잠금화면 미리보기에 같은 휴대폰 테두리 (그림 위에 안쪽으로 그려서 잘리지 않게) */
.mini::after{content:'';position:absolute;inset:0;border-radius:inherit;box-shadow:inset 0 0 0 3px #17191D;pointer-events:none;z-index:6}
.pf-new .mini::after,.mini.gn-ph::after{display:none}
.pf-group.act .mini{box-shadow:0 0 0 2px #fff,0 0 0 4px var(--primary),0 4px 14px rgba(0,0,0,.12)}
.pn-g.on .mini,.gn-looks .gl.on .mini{box-shadow:0 0 0 2px #fff,0 0 0 4px var(--g900)}
.nick-in{width:100%;height:48px;border:1px solid var(--g200);border-radius:12px;padding:0 14px;font-size:16px;color:var(--g900)}
.mesum{margin:0 24px;padding:20px 8px;border-radius:20px;background:var(--g50);display:flex}
.mesum div{flex:1;text-align:center}
.mesum b{display:block;font-size:22px;font-weight:700}
.mesum span{font-size:13px;color:var(--g600);margin-top:4px;display:block}
.mesum div+div{border-left:1px solid var(--g200)}
.notiprev{margin:4px 24px 8px;padding:14px;border-radius:18px;background:var(--g100);display:flex;gap:12px;align-items:flex-start}
.notiprev .ai{width:34px;height:34px;border-radius:9px;flex-shrink:0}
.notiprev .nh{font-size:12px;color:var(--g500);display:flex;justify-content:space-between}
.notiprev .nb{font-size:14px;font-weight:600;margin-top:3px;color:var(--g900);line-height:20px}
.modepv{display:flex;gap:12px;padding:0 24px}
.modepv button{flex:1;border:1.5px solid var(--g200);border-radius:16px;padding:12px;background:#fff;text-align:center;font-size:15px;font-weight:600;color:var(--g700)}
.modepv button.on{border-color:var(--g900);background:var(--g50);color:var(--g900)}
.modepv .pv{height:150px;border-radius:12px;overflow:hidden;position:relative;margin-bottom:10px;background:#111}
.modepv .pv img.full{width:100%;height:100%;object-fit:cover}
.modepv .pv img.blur{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;filter:blur(10px) brightness(.55);transform:scale(1.2)}
.modepv .pv img.fr{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);max-width:76%;max-height:56%;border:3px solid #F4EFE6}

/* ---------- Onboarding ---------- */
.welcome{position:absolute;inset:0;color:#fff;background:#000}
.welcome img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:30% 50%;animation:kb 18s ease-in-out infinite alternate}
@keyframes kb{from{transform:scale(1.05)}to{transform:scale(1.18) translateX(-3%)}}
.welcome .sh{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.25) 0%,rgba(0,0,0,0) 30%,rgba(0,0,0,.55) 60%,rgba(0,0,0,.9) 100%)}
.welcome .in{position:absolute;inset:0;display:flex;flex-direction:column;padding:calc(var(--sat) + 40px) 28px calc(var(--sab) + 20px)}
.welcome .mk{width:56px;height:56px;border-radius:16px;background:#fff;color:var(--g900)!important;display:flex;align-items:center;justify-content:center;color:#fff}
.welcome h1{font-family:var(--serif);font-size:34px;line-height:1.38;font-weight:700;letter-spacing:-.5px;margin-top:auto;text-wrap:balance}
.welcome p{font-size:16px;line-height:1.6;opacity:.85;margin-top:14px}
.welcome .btn{margin-top:32px}
.welcome .credit{font-size:12px;opacity:.6;margin-top:14px;text-align:center}
.perm{margin:4px 24px 0;border-radius:24px;background:var(--g50);padding:24px;display:flex;justify-content:center}
.miniphone{width:150px;height:260px;border-radius:24px;overflow:hidden;position:relative;box-shadow:0 0 0 5px #1b1e23,0 16px 30px rgba(0,0,0,.25)}
.miniphone img{width:100%;height:100%;object-fit:cover;object-position:30% 50%}
.miniphone .t{position:absolute;top:22px;left:0;right:0;text-align:center;color:#fff;font-size:34px;font-weight:200}
.miniphone .q{position:absolute;left:12px;right:12px;bottom:26px;color:#fff;font-family:var(--serif);font-size:12px;line-height:1.5;font-weight:600;text-shadow:0 1px 6px rgba(0,0,0,.6)}
.miniphone .sh{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.3),rgba(0,0,0,0) 35%,rgba(0,0,0,.6))}
.steps{padding:24px 24px 0;display:flex;flex-direction:column;gap:16px}
.step{display:flex;gap:14px;align-items:flex-start}
.step .n{width:28px;height:28px;border-radius:50%;background:var(--g100);display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;color:var(--g700);flex-shrink:0}
.step.ok .n{background:var(--green);color:#fff}
.step .t{font-size:16px;font-weight:600;color:var(--g800)}
.step .d{font-size:14px;color:var(--g500);margin-top:3px;line-height:20px}
.donebox{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center}
.donebox .ill{font-size:64px;margin-bottom:20px}
.donebox h1{font-size:26px;font-weight:700;line-height:36px;letter-spacing:-.4px}
.donebox p{font-size:16px;color:var(--g600);line-height:24px;margin-top:10px}
.obprog{display:flex;gap:6px;padding:0 24px 4px}
.obprog i{flex:1;height:4px;border-radius:2px;background:var(--g100)}
.obprog i.on{background:var(--primary)}

/* share card */
.sharecard{margin:0 auto;width:calc(100% - 48px);max-width:280px;border-radius:20px;overflow:hidden;position:relative;aspect-ratio:9/14;background:#111}
.sharecard img{width:100%;height:100%;object-fit:cover}
.sharecard .ov{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.1),rgba(0,0,0,.05) 35%,rgba(0,0,0,.75));display:flex;flex-direction:column;justify-content:flex-end;padding:22px;color:#fff}
.sharecard .q{font-family:var(--serif);font-size:20px;line-height:1.55;font-weight:600}
.sharecard .f{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:16px;font-size:12px;opacity:.85}
.sharecard .f>span:first-child{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sharecard .f .lg{display:flex;align-items:center;gap:6px;font-family:var(--serif);font-weight:700;font-size:14px;white-space:nowrap;flex-shrink:0}
.shareacts{display:flex;justify-content:space-around;padding:20px 24px 4px}
.shareacts button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:8px;font-size:13px;color:var(--g700)}
.shareacts .c{width:56px;height:56px;border-radius:18px;background:var(--g100);display:flex;align-items:center;justify-content:center;color:var(--g800)}
.sh-art{display:flex;gap:16px;padding:0 24px;align-items:center}
.sh-art img{width:84px;height:84px;border-radius:14px;object-fit:cover;flex-shrink:0}
.sh-art b{display:block;font-family:var(--serif);font-size:19px;line-height:27px}
.sh-art span{display:block;font-size:14px;color:var(--g600);margin-top:4px}
.sh-story{padding:18px 24px 0;font-size:15px;line-height:1.7;color:var(--g700)}

/* ===== 라운드 규칙: 꾸미기 「완료」 버튼처럼 최소한의 라운드만 (각진 건 잠금화면 액자·작품 상세 큰 그림·확대 보기) ===== */
.btn,.btn.sm,.cta .btn,.welcome .btn,.writecard .btn,.dy-ask .btn,.seg{border-radius:8px !important}
.chip,.seg button,.lk-art,.shareacts .c{border-radius:6px !important}
.badge,.hero .cat,.lk-quote .cat,.lk-count,.adbox b{border-radius:4px !important}
.hero,.hero img,.tile,.tile img,.peek .im,.gcard .im,.gcard .im img,.sh-art img,.sharecard,.sharecard img,.modepv .pv,.modepv .pv img,.dy-done .ph,.choice,.scard,.qblock,.writecard,.statcard,.row-card,.adbox{border-radius:8px !important}
.row .thumb,.lk-art img,.lk-noti .ai,.notiprev .ai{border-radius:6px !important}
.lk-frame img,.artimg img,#viewer img{border-radius:0 !important}
.tile .ck,.gcard .im .hrt{border-radius:50% !important}

/* 버튼으로 만든 카드: 내용은 항상 위에서부터 (행 높이가 달라도 이미지 상단 정렬) */
.gcard,.peek,.modepv button{display:flex;flex-direction:column;align-items:stretch;justify-content:flex-start}
.grid{align-items:stretch}
.hscroll{align-items:flex-start}

/* 상세: 그림을 좌우·위아래 여백 없이 꽉 차게 */
.artimg{padding:0;background:none;display:block}
.artimg img{width:100%;height:auto;max-width:none;max-height:none;box-shadow:none}

/* 작가 이름 링크: 모양은 그대로, 누르면 작가 상세로 */
.alink{all:unset;cursor:pointer;-webkit-tap-highlight-color:transparent}
.alink:active{opacity:.6}
</style>
